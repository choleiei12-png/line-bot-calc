<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>ปฏิทินเวร</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1fb;--card:#fff;--ink:#1d1b3a;--mute:#7a7794;--line:#e6e3f4;--brand:#3b2fd8;--bi:#fff;--soft:#ece9fb;--ot:#17a589;--off:#9a97b3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#13122a;--card:#1e1c3d;--ink:#eeedfb;--mute:#9a97c0;--line:#2e2b57;--brand:#7b70ff;--bi:#12102b;--soft:#2a2750}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px "Noto Sans Thai",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:14px 14px 40px}button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.nav b{font-size:18px}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.total{font-size:40px;font-weight:700;line-height:1.1}.total small{font-size:16px;font-weight:500;color:var(--mute);margin-left:4px}
.lbl{color:var(--mute);font-size:13px}.row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;color:var(--mute);font-size:12px;padding-bottom:4px}
.day{aspect-ratio:1/1.1;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.day.today{border:2px solid var(--brand)}.day.empty{visibility:hidden}
.tags{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}.tg{font-size:10px;line-height:1;padding:2px 3px;border-radius:4px;font-weight:700}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(10,8,30,.5);display:none;align-items:flex-end;justify-content:center}.sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.chip{padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);text-align:left;font-weight:500}
.chip.on{border-color:var(--brand);background:var(--soft)}.chip small{display:block;color:var(--mute);font-weight:400}
.primary{width:100%;border:0;background:var(--brand);color:var(--bi);padding:14px;border-radius:14px;font-weight:700}
h3{margin:0}#err{color:#d33;text-align:center;display:none}
</style></head><body><main>
<div class="nav"><button class="ib" id="prev" aria-label="เดือนก่อน">‹</button><b id="mt">…</b><button class="ib" id="next" aria-label="เดือนถัดไป">›</button></div>
<p id="err">เปิดลิงก์ไม่ได้ ลองขอลิงก์ใหม่ในแชท LINE (พิมพ์ ปฏิทิน)</p>
<section class="card"><div class="lbl">รายได้เดือนนี้</div><div class="total"><span id="tot">0</span><small>บาท</small></div><div id="sum"></div></section>
<section class="card"><div class="cal" id="grid"></div><div class="legend" id="legend"></div>
<p class="lbl" style="margin:12px 0 0">แตะวันที่เพื่อแก้เวร ข้อมูลตรงกับที่พิมพ์ในแชท LINE</p></section>
</main>
<div class="sheet" id="sheet"><div class="panel"><h3 id="st"></h3><div class="chips" id="chips"></div><button class="primary" id="done">เสร็จ</button></div></div>
<script>
const MN=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const API="/api/"+location.pathname.split("/")[2],$=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString("th-TH"),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ink=h=>{const n=parseInt(h.slice(1),16);return(((n>>16)&255)*.3+((n>>8)&255)*.59+(n&255)*.11)>150?"#2a2100":"#fff"};
let D=null,cur=null,busy=false;
const tp=id=>D.types.find(t=>t.id===id),tag=t=>`<span class="tg" style="background:${t.color};color:${ink(t.color)}">${esc(t.short)}</span>`;
async function load(y,m){
  const q=y==null?"":`?y=${y}&m=${m}`;
  try{const r=await fetch(API+"/month"+q,{cache:"no-store"});if(!r.ok)throw 0;D=await r.json();$("err").style.display="none";render();if(cur&&$("sheet").classList.contains("show"))chips()}
  catch(e){$("err").style.display="block"}
}
function render(){
  $("mt").textContent=`${MN[D.M]} ${D.Y+543}`;const s=D.sum;$("tot").textContent=fmt(s.total);
  $("sum").innerHTML=`<div class="row"><span>เวรปกติ <span class="lbl">${s.ns} เวร</span></span><b>${fmt(s.ms)}</b></div><div class="row"><span>OT <span class="lbl">${s.no} เวร</span></span><b>${fmt(s.mo)}</b></div><div class="row"><span>รายได้อื่น</span><b>${fmt(s.oth)}</b></div><div class="row"><span class="lbl">วันหยุด (OFF)</span><span class="lbl">${s.nx} วัน</span></div>`;
  const first=new Date(D.Y,D.M,1).getDay(),dim=new Date(D.Y,D.M+1,0).getDate(),n=new Date();
  let h=["อา","จ","อ","พ","พฤ","ศ","ส"].map(d=>`<div class="dow">${d}</div>`).join("")+'<div class="day empty"></div>'.repeat(first);
  for(let d=1;d<=dim;d++){const td=d===n.getDate()&&D.M===n.getMonth()&&D.Y===n.getFullYear();
    h+=`<button class="day${td?" today":""}" data-d="${d}"><span>${d}</span><span class="tags">${(D.days[d]||[]).map(tp).filter(Boolean).map(tag).join("")}</span></button>`}
  $("grid").innerHTML=h;$("legend").innerHTML=D.types.map(t=>`<span>${tag(t)} ${esc(t.name)}</span>`).join("");
}
function chips(){const on=D.days[cur]||[];
  $("chips").innerHTML=D.types.map(t=>`<button class="chip${on.includes(t.id)?" on":""}" data-k="${t.id}">${esc(t.name)}<small>${t.kind==="x"?"วันหยุด":fmt(t.rate)+" บาท"}</small></button>`).join("")}
$("grid").onclick=e=>{const b=e.target.closest("[data-d]");if(!b)return;cur=+b.dataset.d;$("st").textContent=`${cur} ${MN[D.M]} ${D.Y+543}`;chips();$("sheet").classList.add("show")};
$("chips").onclick=async e=>{
  const b=e.target.closest("[data-k]");if(!b||busy)return;const k=b.dataset.k;let a=D.days[cur]||[];
  a=a.includes(k)?a.filter(x=>x!==k):(tp(k).kind==="x"?[k]:[...a.filter(x=>tp(x)&&tp(x).kind!=="x"),k]);
  busy=true;
  try{const r=await fetch(API+"/day",{method:"POST",body:JSON.stringify({y:D.Y,m:D.M,d:cur,ids:a})});if(!r.ok)throw 0;D=await r.json();render();chips()}
  catch(e){$("err").style.display="block"}
  busy=false;
};
$("done").onclick=()=>$("sheet").classList.remove("show");
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").classList.remove("show")};
$("prev").onclick=()=>{let y=D.Y,m=D.M-1;if(m<0){m=11;y--}load(y,m)};
$("next").onclick=()=>{let y=D.Y,m=D.M+1;if(m>11){m=0;y++}load(y,m)};
setInterval(()=>{if(D&&!busy&&!$("sheet").classList.contains("show"))load(D.Y,D.M)},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&D)load(D.Y,D.M)});
load();
</script></body></html>
